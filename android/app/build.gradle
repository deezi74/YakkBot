plugins { id 'com.android.application' }

// A release build is signed with your own key when these are set (environment or ~/.gradle/gradle.properties):
//   YAKK_KEYSTORE (path), YAKK_KEYSTORE_PASSWORD, YAKK_KEY_ALIAS, YAKK_KEY_PASSWORD
// Without them the debug key is used, which is fine for your own phone.
def prop = { String k -> System.getenv(k) ?: (project.findProperty(k) as String) }
def hasKey = prop('YAKK_KEYSTORE') != null

android {
    namespace 'ai.yakkbot.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.yakkbot.app'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.3.0'
        // The built-in Linux (PRoot + Alpine) is 64-bit ARM.
        ndk { abiFilters 'arm64-v8a' }
    }
    // Programs shipped as lib*.so must be unpacked to disk so they can run.
    packaging { jniLibs { useLegacyPackaging true } }
    sourceSets { main { assets.srcDirs += ["$buildDir/generated/yakk-assets"] } }
    signingConfigs {
        if (hasKey) {
            own {
                storeFile file(prop('YAKK_KEYSTORE'))
                storePassword prop('YAKK_KEYSTORE_PASSWORD')
                keyAlias prop('YAKK_KEY_ALIAS')
                keyPassword prop('YAKK_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKey ? signingConfigs.own : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    lint { abortOnError false; checkReleaseBuilds false }
}

// The server (one bundled file) and the web app go into the APK; the app copies them into its Linux.
// Build them first: npm ci && npm run build -w web && node server/bundle.mjs
def repo = rootProject.projectDir.parentFile
tasks.register('yakkAssets', Copy) {
    def server = new File(repo, 'server/dist-bundle/server.mjs')
    def web = new File(repo, 'web/dist')
    doFirst {
        if (!server.isFile() || !new File(web, 'index.html').isFile()) {
            throw new GradleException("Build the server and web app first: npm ci && npm run build -w web && node server/bundle.mjs")
        }
    }
    from(server)
    from(new File(repo, 'server/dist-bundle/server.mjs.LEGAL.txt'))
    from(web) { into 'web' }
    into "$buildDir/generated/yakk-assets/yakkbot"
}
preBuild.dependsOn 'yakkAssets'
