# Builds the Android app and publishes it on a GitHub Release when a tag like v0.2.0 is pushed.
# The download link then stays the same: /releases/latest/download/yakkbot.apk
#
# To sign with your own key (so updates install over each other), add these repository secrets:
#   YAKK_KEYSTORE_BASE64 (base64 of the .jks file), YAKK_KEYSTORE_PASSWORD, YAKK_KEY_ALIAS, YAKK_KEY_PASSWORD
# Without them each build is signed with a throwaway key, and installing an update means
# uninstalling the old app first.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build -w web && node server/bundle.mjs
      - name: PRoot engine for the built-in Linux
        run: |
          sudo apt-get install -y patchelf >/dev/null
          bash android/scripts/fetch-proot.sh android/app/src/main/jniLibs/arm64-v8a
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;27.2.12479018
      # On-phone models: llama.cpp's server built for Android (same as D-Agent). Cached: the build takes ~10 minutes.
      - name: Model engine cache
        id: llama
        uses: actions/cache/restore@v4
        with:
          path: android/deps/llama-out/libllamaserver.so
          key: llama-server-b12017-${{ hashFiles('android/scripts/build-llama-server.sh') }}
      - name: Model engine (llama.cpp)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          if [ ! -f android/deps/llama-out/libllamaserver.so ]; then
            bash android/scripts/build-llama-server.sh android/deps/llama-out || echo "::warning::llama-server build failed; this APK ships without on-phone models"
          fi
          if [ -f android/deps/llama-out/libllamaserver.so ]; then cp android/deps/llama-out/libllamaserver.so android/app/src/main/jniLibs/arm64-v8a/; fi
          ls -la android/app/src/main/jniLibs/arm64-v8a/
      - name: Save model engine cache
        if: steps.llama.outputs.cache-hit != 'true' && hashFiles('android/deps/llama-out/libllamaserver.so') != ''
        uses: actions/cache/save@v4
        with:
          path: android/deps/llama-out/libllamaserver.so
          key: llama-server-b12017-${{ hashFiles('android/scripts/build-llama-server.sh') }}
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - name: Use the signing key, if one is set
        env:
          KEYSTORE: ${{ secrets.YAKK_KEYSTORE_BASE64 }}
          # One secret holding everything: "<password>:<keystore in base64>" (key alias yakkbot).
          SIGNING: ${{ secrets.YAKK_SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING" ]; then
            PW="${SIGNING%%:*}"; KEYSTORE="${SIGNING#*:}"
            echo "::add-mask::$PW"
            { echo "YAKK_KEYSTORE_PASSWORD=$PW"; echo "YAKK_KEY_PASSWORD=$PW"; echo "YAKK_KEY_ALIAS=yakkbot"; } >> "$GITHUB_ENV"
          fi
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/yakk.jks"
            echo "YAKK_KEYSTORE=$RUNNER_TEMP/yakk.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: android
        env:
          YAKK_KEYSTORE_PASSWORD: ${{ secrets.YAKK_KEYSTORE_PASSWORD || env.YAKK_KEYSTORE_PASSWORD }}
          YAKK_KEY_ALIAS: ${{ secrets.YAKK_KEY_ALIAS || env.YAKK_KEY_ALIAS }}
          YAKK_KEY_PASSWORD: ${{ secrets.YAKK_KEY_PASSWORD || env.YAKK_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease && cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/yakkbot.apk"
      - name: Check the signing key
        run: |
          # Without the permanent key the build is signed with a throwaway one: it installs fine, but
          # updating to it means uninstalling first, and the F-Droid repository is skipped.
          if [ -z "$YAKK_KEYSTORE" ]; then echo "::warning::No signing key yet (add the YAKK_SIGNING_KEY secret). This build cannot update over another one in place."; fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Releases are named after the app version (v0.8.0), which the app's Update button compares with its own.
          VERSION="$(sed -n "s/.*versionName '\\(.*\\)'.*/\\1/p" android/app/build.gradle)"
          TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}"; TAG="${TAG:-v$VERSION}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"; echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --latest --title "YakkBot $TAG" --notes "Android app: download yakkbot.apk below, open it on your phone, and tap Set up YakkBot. No Termux needed. Already installed? Open Settings › General › Check for updates, or update through F-Droid."
          gh release upload "$TAG" yakkbot.apk --clobber

      # YakkBot's own F-Droid repository on GitHub Pages: add it in F-Droid once and updates arrive there.
      # Signed with the app's key, so it only runs once the signing key is set.
      - name: Update the F-Droid repository
        if: env.YAKK_KEYSTORE != ''
        env:
          YAKK_KEYSTORE_PASSWORD: ${{ secrets.YAKK_KEYSTORE_PASSWORD || env.YAKK_KEYSTORE_PASSWORD }}
          YAKK_KEY_ALIAS: ${{ secrets.YAKK_KEY_ALIAS || env.YAKK_KEY_ALIAS }}
          YAKK_KEY_PASSWORD: ${{ secrets.YAKK_KEY_PASSWORD || env.YAKK_KEY_PASSWORD }}
        run: |
          set -e
          pip install --quiet fdroidserver
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          git worktree add -f "$RUNNER_TEMP/site" gh-pages 2>/dev/null || { git worktree add --detach "$RUNNER_TEMP/site" && (cd "$RUNNER_TEMP/site" && git checkout --orphan gh-pages && git rm -rqf . || true); }
          W="$RUNNER_TEMP/fdroid"; mkdir -p "$W/repo" "$W/metadata"
          cp fdroid/metadata/*.yml "$W/metadata/"
          cp "$RUNNER_TEMP/site/fdroid/repo/"*.apk "$W/repo/" 2>/dev/null || true
          cp yakkbot.apk "$W/repo/yakkbot-$VERSION.apk"
          # Keep the three newest builds.
          ls -t "$W/repo/"*.apk | tail -n +4 | xargs -r rm -f
          cat > "$W/config.yml" <<EOF
          repo_url: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/fdroid/repo
          repo_name: YakkBot
          repo_description: YakkBot updates, straight from the YakkBot builds.
          repo_keyalias: $YAKK_KEY_ALIAS
          keystore: $YAKK_KEYSTORE
          keystorepass: "$YAKK_KEYSTORE_PASSWORD"
          keypass: "$YAKK_KEY_PASSWORD"
          keydname: CN=YakkBot, O=YakkBot
          sdk_path: $ANDROID_HOME
          EOF
          chmod 600 "$W/config.yml"
          (cd "$W" && fdroid update --pretty)
          rm -rf "$RUNNER_TEMP/site/fdroid"; mkdir -p "$RUNNER_TEMP/site/fdroid"
          cp -r "$W/repo" "$RUNNER_TEMP/site/fdroid/repo"
          FP="$(keytool -list -keystore "$YAKK_KEYSTORE" -storepass "$YAKK_KEYSTORE_PASSWORD" -alias "$YAKK_KEY_ALIAS" 2>/dev/null | sed -n 's/.*(SHA-256): //p' | tr -d ':')"
          URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/fdroid/repo"
          sed -e "s|fdroidrepos://__URL__|fdroidrepos://${URL#https://}|g" -e "s|__URL__|$URL|g" -e "s|__FP__|$FP|g" -e "s|__VERSION__|$VERSION|g" fdroid/index.html > "$RUNNER_TEMP/site/index.html"
          touch "$RUNNER_TEMP/site/.nojekyll"
          cd "$RUNNER_TEMP/site"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && (git diff --cached --quiet || git commit -qm "F-Droid repository: YakkBot $VERSION") && git push -q origin gh-pages
