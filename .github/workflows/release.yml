# Builds the Android app and publishes it on a GitHub Release when a tag like v0.2.0 is pushed.
# The download link then stays the same: /releases/latest/download/yakkbot.apk
#
# To sign with your own key (so updates install over each other), add these repository secrets:
#   YAKK_KEYSTORE_BASE64 (base64 of the .jks file), YAKK_KEYSTORE_PASSWORD, YAKK_KEY_ALIAS, YAKK_KEY_PASSWORD
# Without them each build is signed with a throwaway key, and installing an update means
# uninstalling the old app first.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build -w web && node server/bundle.mjs
      - name: PRoot engine for the built-in Linux
        run: |
          sudo apt-get install -y patchelf >/dev/null
          bash android/scripts/fetch-proot.sh android/app/src/main/jniLibs/arm64-v8a
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;27.2.12479018
      # On-phone models: llama.cpp's server built for Android (same as D-Agent). Cached: the build takes ~10 minutes.
      - name: Model engine cache
        id: llama
        uses: actions/cache/restore@v4
        with:
          path: android/deps/llama-out/libllamaserver.so
          key: llama-server-b12017-${{ hashFiles('android/scripts/build-llama-server.sh') }}
      - name: Model engine (llama.cpp)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          if [ ! -f android/deps/llama-out/libllamaserver.so ]; then
            bash android/scripts/build-llama-server.sh android/deps/llama-out || echo "::warning::llama-server build failed; this APK ships without on-phone models"
          fi
          if [ -f android/deps/llama-out/libllamaserver.so ]; then cp android/deps/llama-out/libllamaserver.so android/app/src/main/jniLibs/arm64-v8a/; fi
          ls -la android/app/src/main/jniLibs/arm64-v8a/
      - name: Save model engine cache
        if: steps.llama.outputs.cache-hit != 'true' && hashFiles('android/deps/llama-out/libllamaserver.so') != ''
        uses: actions/cache/save@v4
        with:
          path: android/deps/llama-out/libllamaserver.so
          key: llama-server-b12017-${{ hashFiles('android/scripts/build-llama-server.sh') }}
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - name: Use the signing key, if one is set
        env:
          KEYSTORE: ${{ secrets.YAKK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/yakk.jks"
            echo "YAKK_KEYSTORE=$RUNNER_TEMP/yakk.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: android
        env:
          YAKK_KEYSTORE_PASSWORD: ${{ secrets.YAKK_KEYSTORE_PASSWORD }}
          YAKK_KEY_ALIAS: ${{ secrets.YAKK_KEY_ALIAS }}
          YAKK_KEY_PASSWORD: ${{ secrets.YAKK_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease && cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/yakkbot.apk"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "YakkBot $TAG" --notes "Android app: download yakkbot.apk below, open it on your phone, and tap Set up YakkBot. No Termux needed."
          gh release upload "$TAG" yakkbot.apk --clobber
