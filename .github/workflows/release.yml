# Builds the Android app and publishes it on a GitHub Release when a tag like v0.2.0 is pushed.
# The download link then stays the same: /releases/latest/download/yakkbot.apk
#
# To sign with your own key (so updates install over each other), add these repository secrets:
#   YAKK_KEYSTORE_BASE64 (base64 of the .jks file), YAKK_KEYSTORE_PASSWORD, YAKK_KEY_ALIAS, YAKK_KEY_PASSWORD
# Without them each build is signed with a throwaway key, and installing an update means
# uninstalling the old app first.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - name: Use the signing key, if one is set
        env:
          KEYSTORE: ${{ secrets.YAKK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/yakk.jks"
            echo "YAKK_KEYSTORE=$RUNNER_TEMP/yakk.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: android
        env:
          YAKK_KEYSTORE_PASSWORD: ${{ secrets.YAKK_KEYSTORE_PASSWORD }}
          YAKK_KEY_ALIAS: ${{ secrets.YAKK_KEY_ALIAS }}
          YAKK_KEY_PASSWORD: ${{ secrets.YAKK_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease && cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/yakkbot.apk"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "YakkBot $TAG" --notes "Android app: download yakkbot.apk below and open it on your phone. Setup steps are in the README."
          gh release upload "$TAG" yakkbot.apk --clobber
